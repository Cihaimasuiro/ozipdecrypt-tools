name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
            archive_format: zip
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""
            archive_format: tar.gz
            rustflags: ""
          - os: macos-13
            target: x86_64-apple-darwin
            bin_suffix: ""
            archive_format: tar.gz
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
            archive_format: tar.gz
            rustflags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "ozipdecrypt-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir
          Copy-Item "target/${{ matrix.target }}/release/ozipdecrypt-gui.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/ozipdecrypt-tools.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          Copy-Item "LICENSE" "$dir/"
          if (Test-Path "keys.toml") { Copy-Item "keys.toml" "$dir/" }
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tag="${{ github.ref_name }}"
          dir="ozipdecrypt-$tag-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/ozipdecrypt-gui" "$dir/"
          cp "target/${{ matrix.target }}/release/ozipdecrypt-tools" "$dir/"
          cp README.md "$dir/"
          cp LICENSE "$dir/"
          if [ -f keys.toml ]; then cp keys.toml "$dir/"; fi
          tar -czvf "$dir.tar.gz" "$dir"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ozipdecrypt-*.zip
            ozipdecrypt-*.tar.gz

  publish:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ozipdecrypt-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ozipdecrypt-*
            dist/SHA256SUMS
          generate_release_notes: true
